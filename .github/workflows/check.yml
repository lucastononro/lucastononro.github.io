name: Check site and game
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix games/white-rabbit
      - run: npm test --prefix games/white-rabbit
      - run: npm run build
      - run: node --test tests/site-game.test.mjs
