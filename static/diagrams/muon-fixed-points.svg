<svg xmlns="http://www.w3.org/2000/svg" class="muon-film" id="muon-fixedpoints" viewBox="0 0 720 590" role="img" aria-labelledby="muon-fixedpoints-title"><title id="muon-fixedpoints-title">An animated staircase compares attracting and repelling fixed points</title><desc>Repelling fixed point at 1. The error doubles at every step. Input 0.6000 moves into the fixed formula, which produces 0.2000. The output moves to the diagonal and is reused as the next input.</desc><text x="24" y="28" class="mf-strong" text-anchor="start">Same fixed point, opposite behavior</text><text x="24" y="54" class="mf-small" text-anchor="start">The error doubles at every step</text><foreignObject x="0" y="65" width="720" height="58"><div xmlns="http://www.w3.org/1999/xhtml" class="mf-equation "><span class="mf-memory-math" style="opacity:1"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mn>2</mn><mi>s</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">p(s)=2s-1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">p</span><span class="mopen">(</span><span class="mord mathnormal">s</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">2</span><span class="mord mathnormal">s</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span></div></foreignObject><foreignObject x="207" y="109" width="93" height="58"><div xmlns="http://www.w3.org/1999/xhtml" class="mf-equation "><span class="" style="opacity:1"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mo>×</mo></mrow><annotation encoding="application/x-tex">2\times</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">2</span><span class="mord">×</span></span></span></span></span></div></foreignObject><foreignObject x="420" y="109" width="110" height="58"><div xmlns="http://www.w3.org/1999/xhtml" class="mf-equation "><span class="" style="opacity:1"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">-1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">−</span><span class="mord">1</span></span></span></span></span></div></foreignObject><line x1="310" y1="153" x2="410" y2="153" class="mf-axis" /><foreignObject x="187" y="164" width="213" height="58"><div xmlns="http://www.w3.org/1999/xhtml" class="mf-equation "><span class="mf-result-math" style="opacity:1"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mn>0.6000</mn><mo stretchy="false">)</mo><mo>=</mo></mrow><annotation encoding="application/x-tex">p(0.6000)=</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">p</span><span class="mopen">(</span><span class="mord">0.6000</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span></span></span></span></span></div></foreignObject><g opacity="1"><text x="440" y="200" class="mf-accent-text" text-anchor="middle">0.2000</text></g><line x1="24" y1="228" x2="696" y2="228" class="mf-axis" /><line x1="55" y1="498" x2="334.59999999999997" y2="498" class="mf-axis" /><line x1="55" y1="498" x2="55" y2="218.40000000000003" class="mf-axis" /><text x="55" y="521" class="mf-small" text-anchor="middle">0</text><text x="171.5" y="521" class="mf-small" text-anchor="middle">0.5</text><text x="42" y="386.5" class="mf-small" text-anchor="end">0.5</text><text x="288" y="521" class="mf-small" text-anchor="middle">1</text><text x="42" y="270" class="mf-small" text-anchor="end">1</text><line x1="55" y1="498" x2="334.59999999999997" y2="218.40000000000003" class="mf-ink mf-dashed" /><line x1="171.5" y1="498" x2="311.3" y2="218.39999999999998" class="mf-memory-arrow" /><circle cx="288" cy="265" r="11" class="mf-fixed-ring"/><circle cx="288" cy="265" r="4" class="mf-open"/><polyline fill="none" points="264.70,498.00 264.70,311.60 241.40,311.60 241.40,358.20 194.80,358.20 194.80,451.40 101.60,451.40" class="mf-orange"/><circle cx="101.60000000000005" cy="451.4" r="5" class="mf-dot"/><line x1="288" y1="498" x2="288" y2="265" class="mf-target" /><line x1="55" y1="555" x2="79" y2="555" class="mf-memory-arrow" /><text x="87" y="561" class="mf-small" text-anchor="start">p(s)</text><line x1="187" y1="555" x2="211" y2="555" class="mf-ink mf-dashed" /><text x="221" y="561" class="mf-small" text-anchor="start">y = s</text><foreignObject x="365" y="270" width="330" height="58"><div xmlns="http://www.w3.org/1999/xhtml" class="mf-equation "><span class="" style="opacity:1"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn><mspace width="1em"/><mtext>always</mtext></mrow><annotation encoding="application/x-tex">p(1)=1\quad\text{always}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">p</span><span class="mopen">(</span><span class="mord">1</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord">1</span><span class="mspace" style="margin-right:1em;"></span><span class="mord text"><span class="mord">always</span></span></span></span></span></span></div></foreignObject><foreignObject x="365" y="328" width="330" height="58"><div xmlns="http://www.w3.org/1999/xhtml" class="mf-equation "><span class="" style="opacity:1"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>s</mi><mn>2</mn></msub><mo>=</mo><mn>0.6000</mn></mrow><annotation encoding="application/x-tex">s_2=0.6000</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">s</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0.6000</span></span></span></span></span></div></foreignObject><foreignObject x="365" y="386" width="330" height="58"><div xmlns="http://www.w3.org/1999/xhtml" class="mf-equation "><span class="mf-result-math" style="opacity:1"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>s</mi><mn>3</mn></msub><mo>=</mo><mn>0.2000</mn></mrow><annotation encoding="application/x-tex">s_{3}=0.2000</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">s</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">3</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0.2000</span></span></span></span></span></div></foreignObject><foreignObject x="365" y="444" width="330" height="58"><div xmlns="http://www.w3.org/1999/xhtml" class="mf-equation "><span class="mf-result-math" style="opacity:1"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/Math