><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mord">∣</span></span></span></span></span></div></foreignObject><text x="530" y="528" class="mf-small" text-anchor="middle">Error: eₖ = sₖ − 1</text><g opacity="1"><text x="360" y="145" class="mf-blue-text" text-anchor="middle">0.6000</text></g></svg>
