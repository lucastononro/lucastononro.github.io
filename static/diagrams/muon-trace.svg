<svg xmlns="http://www.w3.org/2000/svg" class="muon-film" id="muon-trace" viewBox="0 0 720 350" role="img" aria-labelledby="muon-trace-title"><title id="muon-trace-title">Diagonal matrix entries move into the trace sum</title><desc>The diagonal of C equals 3 and minus 2. Moving those two entries into the sum gives trace C equals 1. The other entries are ignored.</desc><text x="24" y="28" class="mf-strong" text-anchor="start">Trace: collect the diagonal</text><text x="24" y="54" class="mf-small" text-anchor="start">The trace is one number</text><text x="53" y="153" class="" text-anchor="end">C =</text><polyline fill="none" points="70.00,85.00 60.00,85.00 60.00,215.00 70.00,215.00" class="mf-ink"/><polyline fill="none" points="216.00,85.00 226.00,85.00 226.00,215.00 216.00,215.00" class="mf-ink"/><text x="98" y="118" class="mf-accent-text mf-number" text-anchor="middle">3</text><text x="188" y="118" class="mf-small mf-faded" text-anchor="middle">0</text><text x="98" y="198" class="mf-small mf-faded" text-anchor="middle">2</text><text x="188" y="198" class="mf-accent-text mf-number" text-anchor="middle">−2</text><foreignObject x="368" y="86" width="300" height="58"><div xmlns="http://www.w3.org/1999/xhtml" class="mf-equation "><span class="" style="opacity:1"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">tr</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>C</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\operatorname{tr}(C)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop"><span class="mord mathrm">tr</span></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="mclose">)</span></span></span></span></span></div></foreignObject><text x="458" y="178" class="mf-accent-text mf-number" text-anchor="middle">3</text><text x="504" y="178" class="" text-anchor="middle">+</text><text x="548" y="178" class="mf-accent-text mf-number" text-anchor="middle">(−2)</text><foreignObject x="408" y="200" width="220" height="58"><div xmlns="http://www.w3.org/1999/xhtml" class="mf-equation "><span class="mf-result-math" style="opacity:1"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">=1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.3669em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span></div></foreignObject><text x="360" y="323" class="mf-small" text-anchor="middle">The off-diagonal entries stay out of this sum.</text></svg>
