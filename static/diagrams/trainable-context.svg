    <path class="dg-accent" d="M380 82 Q404 88 426 82"/>
    <path class="dg-accent" d="M426 82 l-9 -4 m9 4 l-9 5"/>

    <path class="dg-accent" stroke-dasharray="5 6" d="M426 60 Q403 54 381 60"/>
    <path class="dg-accent" d="M381 60 l9 -4 m-9 4 l9 5"/>
    <text class="dg-note" x="386" y="30">SSE</text>

    <!-- out to the three clouds -->
    <path class="dg-accent" d="M470 110 Q330 132 176 196"/>
    <path class="dg-accent" d="M176 196 l10 1 m-10 -1 l7 -7"/>

    <path class="dg-accent" d="M560 110 Q500 152 384 197"/>
    <path class="dg-accent" d="M384 197 l10 1 m-10 -1 l7 -7"/>

    <path class="dg-accent" d="M660 110 Q650 155 592 197"/>
    <path class="dg-accent" d="M592 197 l10 -2 m-10 2 l5 -9"/>

    <text class="dg-note" x="22" y="296">Redrawn from the repo's own C4 context diagram; the bottom row is all somebody else's cloud.</text>
