<!doctype html><html lang="en"><meta charset="utf-8"><title>Phone layout review</title><style>body{margin:0;background:#333;color:white;font:13px system-ui}header{height:48px;display:flex;align-items:center;gap:12px;padding:0 12px}button,select{padding:6px}iframe{display:block;border:0;background:#102422}</style><header><strong>Phone layout review</strong><button id="landscape">Landscape 844 × 390</button><button id="small">Small landscape 667 × 375</button><button id="keyboard">Keyboard space 844 × 210</button><button id="portrait">Portrait 390 × 650</button><select id="checkpoint" aria-label="Review checkpoint"><option value="hall">Opening hall</option><option value="garden&after=caterpillar&at=mushroom">Mushroom</option><option value="garden&after=fan&at=kitchen">Pepper kitchen</option><option value="court&after=gardeners&at=roses">Painting the roses</option><option value="garden&after=minutes&at=signs">Cheshire signs</option><option value="court&after=trial&at=croquet">Croquet</option><option value="court&after=croquet&at=effigies">Wooden figures</option><option value="tower&at=assembly">House construction</option><option value="tower&after=assembly&at=amber_view">House perspective</option></select></header><iframe id="phone" width="844" height="390" title="Phone game preview" allow="fullscreen" src="/?review=hall&touch=1"></iframe><pre id="preview-errors" style="white-space:pre-wrap"></pre><script>const f=document.querySelector('#phone');f.addEventListener('load',()=>f.contentWindow.addEventListener('error',e=>{document.querySelector('#preview-errors').textContent=[e.message,e.filename,e.lineno,e.error?.stack].join('\n')}));document.querySelector('#landscape').onclick=()=>{f.width=844;f.height=390};document.querySelector('#small').onclick=()=>{f.width=667;f.height=375};document.querySelector('#keyboard').onclick=()=>{f.width=844;f.height=210};document.querySelector('#portrait').onclick=()=>{f.width=390;f.height=650};document.querySelector('#checkpoint').onchange=e=>{f.src='/?review='+e.target.value+'&touch=1'};</script></html>
